plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// ===== 平台选择 =====
def ffmpegPlatforms = (project.findProperty("ffmpeg_platforms") ?: "win64")
        .toString().split(",").collect { it.trim() }.findAll { !it.isEmpty() }

// FFmpeg 平台 → JavaFX 平台分类器映射
def javafxPlatformMap = [
        "win64"      : "win",
        "osx64"      : "mac",
        "osxm1"      : "mac-aarch64",
        "linux64"    : "linux",
        "linux-arm64": "linux-aarch64"
]

def javafxPlatforms
if (ffmpegPlatforms.isEmpty()) {
    javafxPlatforms = ["win", "mac", "mac-aarch64", "linux", "linux-aarch64"]
} else {
    javafxPlatforms = ffmpegPlatforms
            .collect { javafxPlatformMap[it] }
            .findAll { it != null }
            .unique()
}

def versionSuffix
if (ffmpegPlatforms == ["win64"]) {
    versionSuffix = ""
} else if (ffmpegPlatforms.isEmpty()) {
    versionSuffix = "-noffmpeg"
} else {
    versionSuffix = "-" + ffmpegPlatforms.join("-")
}

loom {
    splitEnvironmentSourceSets()
}

version = "1.0.0" + versionSuffix
group = "com.fsaobdriiucmapi.setthebackgroundmusic"

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

// JavaFX 锁定到正式版
def javafxVersion = "25.0.2"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation fileTree(dir: 'libs', include: '*.jar')

    implementation "curse.maven:melody-938643:7875748"
    include "curse.maven:melody-938643:7875748"

    // JavaFX —— 去重后逐个 include
    javafxPlatforms.each { jp ->
        api(include("org.openjfx:javafx-base:${javafxVersion}:${jp}"))
        api(include("org.openjfx:javafx-controls:${javafxVersion}:${jp}"))
        api(include("org.openjfx:javafx-graphics:${javafxVersion}:${jp}"))
        api(include("org.openjfx:javafx-media:${javafxVersion}:${jp}"))
        api(include("org.openjfx:javafx-swing:${javafxVersion}:${jp}"))
    }

    // JAVE2
    api(include("ws.schild:jave-core:4.2.0"))
    ffmpegPlatforms.each { p ->
        api(include("ws.schild:jave-nativebin-${p}:4.2.0"))
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.name}" }
    }
}

tasks.withType(Jar).configureEach {
    archiveVersion = ""
}