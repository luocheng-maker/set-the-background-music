plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

loom {
    splitEnvironmentSourceSets()
}

version = "1.0.0"
group = "com.fsaobdriiucmapi.setthebackgroundmusic"

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    
    // 直接指定 libs 目录下的具体文件
    implementation fileTree(dir: 'libs', include: '*.jar')
    implementation "curse.maven:melody-938643:7875748"
    include "curse.maven:melody-938643:7875748"
}

tasks.register('debugClasspath') {
    doLast {
        println "Client compile classpath:"
        sourceSets.client.compileClasspath.files.each { println it }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}